<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex">
    <title>Your Trip Invitation | myOTC</title>

    <style>
        [hidden] {
            display: none !important;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f5f7fa;
            color: #102338;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        main {
            width: 100%;
            max-width: 420px;
            padding: 36px 26px;
            border-radius: 28px;
            background: white;
            text-align: center;
            box-shadow: 0 16px 60px rgba(16, 35, 56, 0.07);
        }

        .brand {
            color: #3d7584;
            font-size: 32px;
            font-weight: 900;
        }

        h1 {
            margin: 28px 0 12px;
            font-size: 30px;
        }

        p {
            color: #64748b;
            line-height: 1.6;
        }

        a,
        button {
            display: block;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            font: inherit;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        a {
            margin-top: 26px;
            border: 0;
            background: #3d7584;
            color: white;
        }

        button {
            margin-top: 12px;
            border: 1px solid #dce3e9;
            background: white;
            color: #3d7584;
        }

        .small {
            margin-top: 24px;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <main>
        <div class="brand">myOTC</div>

        <h1 id="heading">You're Invited</h1>

        <p id="description">
            Your next adventure is waiting.
            Open myOTC to review and accept your trip invitation.
        </p>

        <a id="open" hidden>Open myOTC</a>

        <button id="copy" type="button" hidden>
            Copy Invite Link
        </button>

        <p id="help" class="small">
            Install myOTC first, then return to this invitation.
            If you're testing the app, install it through TestFlight.
        </p>
    </main>

    <script>
        const token = new URL(window.location.href)
            .searchParams.get("token") || "";

        const valid = /^[a-f0-9]{64}$/.test(token);

        if (valid) {
            const open = document.getElementById("open");
            const copy = document.getElementById("copy");

            open.href = "myotc://invite?token=" + token;
            open.hidden = false;
            copy.hidden = false;

            copy.addEventListener("click", async () => {
                try {
                    await navigator.clipboard.writeText(
                        window.location.href
                    );

                    copy.textContent = "Link Copied";
                } catch {
                    document.getElementById("help").textContent =
                        "Copy the invitation from your browser address bar.";
                }
            });
        } else {
            document.getElementById("heading").textContent =
                "Invalid Invitation";

            document.getElementById("description").textContent =
                "This link is missing its invitation code. Ask your trip organizer to share the full link.";

            document.getElementById("help").hidden = true;
        }
    </script>
</body>

</html>
